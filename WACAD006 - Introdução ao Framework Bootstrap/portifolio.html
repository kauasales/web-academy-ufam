<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Projetos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">

    <main class="container">
        <h2 class="text-start mt-5 mb-4">Meus Projetos</h2>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
            <div class="col">
                <div class="border border-secondary-subtle rounded bg-white p-5 h-100">
                    <h3 class="h5">Projeto Alpha</h3>
                    <p class="text-muted small mb-0">Automação de processos e coleta de dados.</p>
                </div>
            </div>

            <div class="col">
                <div class="border border-secondary-subtle rounded bg-white p-5 h-100">
                    <h3 class="h5">Projeto Beta</h3>
                    <p class="text-muted small mb-0">Dashboard interativo para análise financeira.</p>
                </div>
            </div>

            <div class="col">
                <div class="border border-secondary-subtle rounded bg-white p-5 h-100">
                    <h3 class="h5">Projeto Gamma</h3>
                    <p class="text-muted small mb-0">Aplicativo mobile para gerenciamento de tarefas.</p>
                </div>
            </div>

            <div class="col">
                <div class="border border-secondary-subtle rounded bg-white p-5 h-100">
                    <h3 class="h5">Projeto Delta</h3>
                    <p class="text-muted small mb-0">Integração de APIs e sistemas legados.</p>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
